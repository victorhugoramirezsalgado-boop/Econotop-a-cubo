mporal con Claude para hacer cambios al repo.
# Solo responde al dueño del repo cuando escribe @claude en un issue o comentario.
# PARA QUITAR EL ACCESO: borra este archivo, borra el secreto
# CLAUDE_CODE_OAUTH_TOKEN (Settings > Secrets and variables > Actions)
# y desinstala la app "Claude" (Settings > GitHub Apps).
name: Claude
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  claude:
    if: >-
      github.actor == github.repository_owner &&
      (contains(github.event.comment.body, '@claude') ||
       contains(github.event.issue.body, '@claude') ||
       contains(github.event.issue.title, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 30"